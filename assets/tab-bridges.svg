<svg xmlns="http://www.w3.org/2000/svg" width="960" height="540" viewBox="0 0 960 540" role="img" aria-labelledby="title desc">
  <title id="title">Bridges tab example</title>
  <desc id="desc">Synthetic HomeKit Inspector Bridges tab with independent bridge, room, and capability filters.</desc>
  <rect width="960" height="540" fill="#f4f7fb"/>
  <style>.title{font:700 24px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#172033}.h{font:700 13px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#68758a;letter-spacing:.7px}.t{font:600 14px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#172033}.m{font:400 12px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#68758a}</style>
  <text x="34" y="44" class="title">Bridges</text>
  <text x="34" y="70" class="m">Bridge relationships and the accessories contributed to HomeKit</text>
  <g transform="translate(34 86)">
    <rect width="240" height="32" rx="6" fill="#fff" stroke="#cbd5e1"/><text x="14" y="21" class="m">All bridges</text>
    <rect x="252" width="240" height="32" rx="6" fill="#fff" stroke="#cbd5e1"/><text x="266" y="21" class="m">All accessory rooms</text>
    <rect x="504" width="190" height="32" rx="6" fill="#fff" stroke="#cbd5e1"/><text x="518" y="21" class="m">All capabilities</text>
    <rect x="706" width="152" height="32" rx="6" fill="#fff" stroke="#cbd5e1"/><text x="738" y="21" class="m">Clear filters</text>
  </g>
  <g transform="translate(34 142)">
    <rect width="892" height="94" rx="8" fill="#fff" stroke="#dce3ed"/><rect width="4" height="94" fill="#6d5bd0"/>
    <text x="22" y="34" class="t">Homebridge Main</text><text x="22" y="58" class="m">3 accessories - System</text>
    <rect x="380" y="20" width="144" height="50" rx="7" fill="#f8fafc" stroke="#dce3ed"/><text x="394" y="49" class="m">Security Helper</text>
    <rect x="536" y="20" width="144" height="50" rx="7" fill="#f8fafc" stroke="#dce3ed"/><text x="550" y="49" class="m">Webhook Contact</text>
    <rect x="692" y="20" width="170" height="50" rx="7" fill="#f8fafc" stroke="#dce3ed"/><text x="706" y="49" class="m">Example Camera</text>
  </g>
  <g transform="translate(34 256)">
    <rect width="892" height="94" rx="8" fill="#fff" stroke="#dce3ed"/><rect width="4" height="94" fill="#0891b2"/>
    <text x="22" y="34" class="t">Hue Bridge</text><text x="22" y="58" class="m">3 accessories - Lighting</text>
    <rect x="380" y="20" width="144" height="50" rx="7" fill="#f8fafc" stroke="#dce3ed"/><text x="394" y="49" class="m">Table Light</text>
    <rect x="536" y="20" width="144" height="50" rx="7" fill="#f8fafc" stroke="#dce3ed"/><text x="550" y="49" class="m">Path Light</text>
    <rect x="692" y="20" width="170" height="50" rx="7" fill="#f8fafc" stroke="#dce3ed"/><text x="706" y="49" class="m">Wall Switch</text>
  </g>
  <g transform="translate(34 370)">
    <rect width="892" height="94" rx="8" fill="#fff" stroke="#dce3ed"/><rect width="4" height="94" fill="#2563eb"/>
    <text x="22" y="34" class="t">Home Assistant Bridge</text><text x="22" y="58" class="m">3 accessories - Utilities</text>
    <rect x="380" y="20" width="144" height="50" rx="7" fill="#f8fafc" stroke="#dce3ed"/><text x="394" y="49" class="m">Energy Sensor</text>
    <rect x="536" y="20" width="144" height="50" rx="7" fill="#f8fafc" stroke="#dce3ed"/><text x="550" y="49" class="m">Water Valve</text>
    <rect x="692" y="20" width="170" height="50" rx="7" fill="#f8fafc" stroke="#dce3ed"/><text x="706" y="49" class="m">Appliance Status</text>
  </g>
</svg>
