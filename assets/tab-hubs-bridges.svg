<svg xmlns="http://www.w3.org/2000/svg" width="960" height="540" viewBox="0 0 960 540" role="img" aria-labelledby="title desc">
  <title id="title">Hubs and Bridges tab example</title>
  <desc id="desc">Synthetic HomeKit Inspector Hubs and Bridges tab showing home hubs, bridges, and bridged accessories.</desc>
  <rect width="960" height="540" fill="#f4f7fb"/>
  <style>.title{font:700 24px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#172033}.h{font:700 13px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#68758a;letter-spacing:.7px}.t{font:500 14px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#172033}.m{font:400 12px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#68758a}.b{font:600 12px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#11834f}</style>
  <text x="34" y="44" class="title">Hubs &amp; Bridges</text>
  <text x="34" y="70" class="m">Resident devices and bridge relationships from HomeKit</text>
  <g transform="translate(34 104)">
    <rect width="420" height="330" rx="8" fill="#fff" stroke="#dce3ed"/>
    <text x="18" y="32" class="h">HOME HUBS</text>
    <rect x="18" y="58" width="384" height="70" rx="7" fill="#edf4ff" stroke="#8ab2ff"/><rect x="18" y="58" width="3" height="70" fill="#2563eb"/>
    <text x="34" y="86" class="t">Living Room HomePod</text><text x="286" y="86" class="b">Primary</text>
    <text x="34" y="110" class="m">Reachable, Apple, Living Room</text><circle cx="370" cy="83" r="5" fill="#11834f"/>
    <rect x="18" y="148" width="384" height="70" rx="7" fill="#fff" stroke="#dce3ed"/>
    <text x="34" y="176" class="t">Kitchen HomePod mini</text>
    <text x="34" y="200" class="m">Reachable, Apple, Kitchen</text><circle cx="370" cy="173" r="5" fill="#11834f"/>
    <rect x="18" y="238" width="384" height="70" rx="7" fill="#fff" stroke="#dce3ed"/>
    <text x="34" y="266" class="t">Office Apple TV</text>
    <text x="34" y="290" class="m">Standby, Apple, Office</text><circle cx="370" cy="263" r="5" fill="#a65f00"/>
  </g>
  <g transform="translate(486 104)">
    <rect width="440" height="330" rx="8" fill="#fff" stroke="#dce3ed"/>
    <text x="18" y="32" class="h">BRIDGES</text>
    <rect x="18" y="48" width="404" height="66" rx="7" fill="#f8fafc"/><rect x="18" y="48" width="3" height="66" fill="#6d5bd0"/><text x="34" y="70" class="t">Homebridge Main</text>
    <text x="54" y="98" class="m">Example Camera, Webhook Contact, Security Helper</text>
    <line x1="34" y1="118" x2="406" y2="118" stroke="#dce3ed"/>
    <rect x="18" y="132" width="404" height="66" rx="7" fill="#f8fafc"/><rect x="18" y="132" width="3" height="66" fill="#0891b2"/><text x="34" y="154" class="t">Hue Bridge</text>
    <text x="54" y="182" class="m">Kitchen Table Light, Path Light, Wall Switch</text>
    <line x1="34" y1="202" x2="406" y2="202" stroke="#dce3ed"/>
    <rect x="18" y="216" width="404" height="66" rx="7" fill="#f8fafc"/><rect x="18" y="216" width="3" height="66" fill="#2563eb"/><text x="34" y="238" class="t">Home Assistant Bridge</text>
    <text x="54" y="266" class="m">Energy Sensor, Water Valve, Appliance Status</text>
  </g>
</svg>
