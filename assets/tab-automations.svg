<svg xmlns="http://www.w3.org/2000/svg" width="960" height="540" viewBox="0 0 960 540" role="img" aria-labelledby="title desc">
  <title id="title">Automations tab example</title>
  <desc id="desc">Synthetic HomeKit Inspector Automations tab with contextual filters and WHEN IF THEN rule sections.</desc>
  <rect width="960" height="540" fill="#f4f7fb"/>
  <style>.title{font:700 24px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#172033}.h{font:700 13px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#68758a;letter-spacing:.7px}.t{font:500 14px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#172033}.m{font:400 12px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#68758a}.badge{font:600 11px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#11834f}</style>
  <text x="34" y="44" class="title">Automations</text>
  <text x="34" y="70" class="m">Readable WHEN, IF, THEN sections for Home.app and richer Eve-style rules</text>
  <g transform="translate(34 86)">
    <rect width="132" height="32" rx="6" fill="#fff" stroke="#cbd5e1"/><text x="12" y="21" class="m">All statuses</text>
    <rect x="140" width="132" height="32" rx="6" fill="#fff" stroke="#cbd5e1"/><text x="152" y="21" class="m">All themes</text>
    <rect x="280" width="132" height="32" rx="6" fill="#fff" stroke="#cbd5e1"/><text x="292" y="21" class="m">All rooms</text>
    <rect x="420" width="132" height="32" rx="6" fill="#fff" stroke="#cbd5e1"/><text x="432" y="21" class="m">Both types</text>
    <rect x="560" width="150" height="32" rx="6" fill="#fff" stroke="#cbd5e1"/><text x="572" y="21" class="m">All confidence</text>
    <rect x="718" width="140" height="32" rx="6" fill="#fff" stroke="#cbd5e1"/><text x="746" y="21" class="m">Clear filters</text>
  </g>
  <g transform="translate(0 36)">
  <rect x="34" y="104" width="250" height="350" rx="8" fill="#fff" stroke="#dce3ed"/>
  <rect x="35" y="105" width="248" height="72" fill="#edf4ff"/><rect x="35" y="105" width="3" height="72" fill="#2563eb"/>
  <text x="54" y="136" class="t">Example Gate Opens</text>
  <text x="54" y="160" class="m">active / security / medium</text>
  <line x1="54" y1="184" x2="264" y2="184" stroke="#dce3ed"/>
  <text x="54" y="216" class="t">Kitchen Button Press</text>
  <text x="54" y="240" class="m">active / lighting / auto</text>
  <line x1="54" y1="264" x2="264" y2="264" stroke="#dce3ed"/>
  <text x="54" y="296" class="t">Away Sunset Lights</text>
  <text x="54" y="320" class="m">active / presence / review</text>
  <rect x="310" y="104" width="616" height="350" rx="8" fill="#fff" stroke="#dce3ed"/>
  <text x="334" y="140" class="title">Example Gate Opens</text>
  <rect x="334" y="166" width="72" height="24" rx="5" fill="#e9f8f0" stroke="#a9dec4"/><text x="350" y="183" class="badge">Active</text>
  <g transform="translate(334 220)">
    <rect width="170" height="150" rx="7" fill="#f7faff" stroke="#dce3ed"/><rect width="170" height="3" fill="#2563eb"/><text x="18" y="32" class="h">WHEN</text><text x="18" y="70" class="m">Gate contact opens</text><text x="18" y="100" class="m">Motion is detected</text>
    <rect x="204" width="170" height="150" rx="7" fill="#faf9ff" stroke="#dce3ed"/><rect x="204" width="170" height="3" fill="#6d5bd0"/><text x="222" y="32" class="h">IF</text><text x="222" y="70" class="m">Security is Away</text><text x="222" y="100" class="m">sunset &lt;= now()</text>
    <rect x="408" width="170" height="150" rx="7" fill="#f7fcf9" stroke="#dce3ed"/><rect x="408" width="170" height="3" fill="#11834f"/><text x="426" y="32" class="h">THEN</text><text x="426" y="70" class="m">Run scene: Alert</text><text x="426" y="100" class="m">Turn on Path Lights</text>
  </g>
  </g>
</svg>
