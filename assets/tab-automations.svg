<svg xmlns="http://www.w3.org/2000/svg" width="960" height="540" viewBox="0 0 960 540" role="img" aria-labelledby="title desc">
  <title id="title">Automations tab example</title>
  <desc id="desc">Synthetic HomeKit Inspector Automations tab with WHEN IF THEN rule sections.</desc>
  <rect width="960" height="540" fill="#f6f7f9"/>
  <style>.title{font:700 24px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#1f2933}.h{font:700 13px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#65758b;letter-spacing:.7px}.t{font:500 14px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#1f2933}.m{font:400 12px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#65758b}.badge{font:600 11px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#19713b}</style>
  <text x="34" y="44" class="title">Automations</text>
  <text x="34" y="70" class="m">Readable WHEN, IF, THEN sections for Home.app and richer Eve-style rules</text>
  <rect x="34" y="104" width="250" height="350" rx="8" fill="#fff" stroke="#d8dee8"/>
  <text x="54" y="136" class="t">Example Gate Opens</text>
  <text x="54" y="160" class="m">active · security · medium</text>
  <line x1="54" y1="184" x2="264" y2="184" stroke="#d8dee8"/>
  <text x="54" y="216" class="t">Kitchen Button Press</text>
  <text x="54" y="240" class="m">active · lighting · auto</text>
  <line x1="54" y1="264" x2="264" y2="264" stroke="#d8dee8"/>
  <text x="54" y="296" class="t">Away Sunset Lights</text>
  <text x="54" y="320" class="m">active · presence · review</text>
  <rect x="310" y="104" width="616" height="350" rx="8" fill="#fff" stroke="#d8dee8"/>
  <text x="334" y="140" class="title">Example Gate Opens</text>
  <rect x="334" y="166" width="94" height="24" rx="12" fill="#ecf8ef"/><text x="356" y="183" class="badge">Active</text>
  <g transform="translate(334 220)">
    <rect width="170" height="150" rx="7" fill="#fff" stroke="#d8dee8"/><text x="18" y="32" class="h">WHEN</text><text x="18" y="70" class="m">Gate contact opens</text><text x="18" y="100" class="m">Motion is detected</text>
    <rect x="204" width="170" height="150" rx="7" fill="#fff" stroke="#d8dee8"/><text x="222" y="32" class="h">IF</text><text x="222" y="70" class="m">Security is Away</text><text x="222" y="100" class="m">sunset &lt;= now()</text>
    <rect x="408" width="170" height="150" rx="7" fill="#fff" stroke="#d8dee8"/><text x="426" y="32" class="h">THEN</text><text x="426" y="70" class="m">Run scene: Alert</text><text x="426" y="100" class="m">Turn on Path Lights</text>
  </g>
</svg>
