<svg xmlns="http://www.w3.org/2000/svg" width="960" height="540" viewBox="0 0 960 540" role="img" aria-labelledby="title desc">
  <title id="title">Scenes tab example</title>
  <desc id="desc">Synthetic HomeKit Inspector Scenes tab showing scene actions.</desc>
  <rect width="960" height="540" fill="#f6f7f9"/>
  <style>.title{font:700 24px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#1f2933}.h{font:700 13px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#65758b;letter-spacing:.7px}.t{font:500 14px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#1f2933}.m{font:400 12px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#65758b}</style>
  <text x="34" y="44" class="title">Scenes</text>
  <text x="34" y="70" class="m">Scene actions are shown separately from automations that run them</text>
  <rect x="34" y="104" width="250" height="350" rx="8" fill="#fff" stroke="#d8dee8"/>
  <text x="54" y="136" class="t">Good Morning</text><text x="54" y="160" class="m">6 actions</text>
  <line x1="54" y1="184" x2="264" y2="184" stroke="#d8dee8"/>
  <text x="54" y="216" class="t">Movie Time</text><text x="54" y="240" class="m">11 actions</text>
  <line x1="54" y1="264" x2="264" y2="264" stroke="#d8dee8"/>
  <text x="54" y="296" class="t">Security Alert</text><text x="54" y="320" class="m">4 actions</text>
  <rect x="310" y="104" width="616" height="350" rx="8" fill="#fff" stroke="#d8dee8"/>
  <text x="334" y="140" class="title">Good Morning</text>
  <text x="334" y="174" class="m">HMActionSetTypeUserDefined</text>
  <g transform="translate(334 216)">
    <rect width="560" height="42" rx="7" fill="#fff" stroke="#d8dee8"/><text x="18" y="27" class="t">Kitchen Table Light / Power State = true</text>
    <rect y="58" width="560" height="42" rx="7" fill="#fff" stroke="#d8dee8"/><text x="18" y="85" class="t">Living Room Blinds / Target Position = 80</text>
    <rect y="116" width="560" height="42" rx="7" fill="#fff" stroke="#d8dee8"/><text x="18" y="143" class="t">Hall Speaker / Media Playback = play</text>
  </g>
</svg>
