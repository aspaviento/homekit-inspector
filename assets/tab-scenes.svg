<svg xmlns="http://www.w3.org/2000/svg" width="960" height="540" viewBox="0 0 960 540" role="img" aria-labelledby="title desc">
  <title id="title">Scenes tab example</title>
  <desc id="desc">Synthetic HomeKit Inspector Scenes tab with independent action-room and characteristic filters.</desc>
  <rect width="960" height="540" fill="#f4f7fb"/>
  <style>.title{font:700 24px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#172033}.h{font:700 13px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#68758a;letter-spacing:.7px}.t{font:500 14px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#172033}.m{font:400 12px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#68758a}</style>
  <text x="34" y="44" class="title">Scenes</text>
  <text x="34" y="70" class="m">Scene actions are shown separately from automations that run them</text>
  <g transform="translate(34 86)">
    <rect width="300" height="32" rx="6" fill="#fff" stroke="#cbd5e1"/><text x="14" y="21" class="m">All action rooms</text>
    <rect x="312" width="350" height="32" rx="6" fill="#fff" stroke="#cbd5e1"/><text x="326" y="21" class="m">All characteristics</text>
    <rect x="674" width="184" height="32" rx="6" fill="#fff" stroke="#cbd5e1"/><text x="716" y="21" class="m">Clear filters</text>
  </g>
  <g transform="translate(0 36)">
  <rect x="34" y="104" width="250" height="350" rx="8" fill="#fff" stroke="#dce3ed"/>
  <rect x="35" y="105" width="248" height="72" fill="#edf4ff"/><rect x="35" y="105" width="3" height="72" fill="#2563eb"/>
  <text x="54" y="136" class="t">Good Morning</text><text x="54" y="160" class="m">6 actions</text>
  <line x1="54" y1="184" x2="264" y2="184" stroke="#dce3ed"/>
  <text x="54" y="216" class="t">Movie Time</text><text x="54" y="240" class="m">11 actions</text>
  <line x1="54" y1="264" x2="264" y2="264" stroke="#dce3ed"/>
  <text x="54" y="296" class="t">Security Alert</text><text x="54" y="320" class="m">4 actions</text>
  <rect x="310" y="104" width="616" height="350" rx="8" fill="#fff" stroke="#dce3ed"/>
  <text x="334" y="140" class="title">Good Morning</text>
  <text x="334" y="174" class="m">HMActionSetTypeUserDefined</text>
  <g transform="translate(334 216)">
    <rect width="560" height="42" rx="7" fill="#f8fafc" stroke="#dce3ed"/><rect width="3" height="42" fill="#0891b2"/><text x="18" y="27" class="t">Kitchen Table Light / Power State = true</text>
    <rect y="58" width="560" height="42" rx="7" fill="#f8fafc" stroke="#dce3ed"/><rect y="58" width="3" height="42" fill="#0891b2"/><text x="18" y="85" class="t">Living Room Blinds / Target Position = 80</text>
    <rect y="116" width="560" height="42" rx="7" fill="#f8fafc" stroke="#dce3ed"/><rect y="116" width="3" height="42" fill="#0891b2"/><text x="18" y="143" class="t">Hall Speaker / Media Playback = play</text>
  </g>
  </g>
</svg>
