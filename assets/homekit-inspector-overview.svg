    <rect x="3" y="3" width="113" height="32" rx="5" fill="#fff" stroke="#dce3ed"/>
    <text x="16" y="25" class="text" fill="#1749b1">Home Layout</text>
    <text x="132" y="25" class="text">Hubs</text>
    <text x="196" y="25" class="text">Bridges</text>
    <text x="282" y="25" class="text">Context Sources</text>
    <text x="444" y="25" class="text">Manufacturers</text>
    <text x="592" y="25" class="text">Capabilities</text>
    <text x="722" y="25" class="text">Automations</text>
    <text x="852" y="25" class="text">Scenes</text>
    <rect x="1010" y="0" width="390" height="38" rx="6" fill="#fff" stroke="#cbd5e1"/>
    <text x="1026" y="25" class="muted">Search current view</text>
  </g>

  <g transform="translate(40 230)">
    <rect width="300" height="38" rx="6" fill="#fff" stroke="#cbd5e1"/><text x="16" y="25" class="muted">All zones</text>
    <rect x="312" width="300" height="38" rx="6" fill="#fff" stroke="#cbd5e1"/><text x="328" y="25" class="muted">All rooms</text>
    <rect x="624" width="420" height="38" rx="6" fill="#fff" stroke="#cbd5e1"/><text x="640" y="25" class="muted">All capabilities</text>
    <rect x="1056" width="304" height="38" rx="6" fill="#fff" stroke="#cbd5e1"/><text x="1160" y="25" class="muted">Clear filters</text>
  </g>

  <g transform="translate(0 50)">
  <rect x="40" y="244" width="1360" height="596" rx="8" fill="#fff" stroke="#dce3ed"/>
  <text x="64" y="288" class="h2">Home Layout</text>
  <g transform="translate(64 306)">
    <rect width="58" height="20" rx="10" fill="#fff" stroke="#dce3ed"/><text x="10" y="14" class="badge">4 zones</text>
    <rect x="66" width="70" height="20" rx="10" fill="#fff" stroke="#dce3ed"/><text x="76" y="14" class="badge">12 rooms</text>
