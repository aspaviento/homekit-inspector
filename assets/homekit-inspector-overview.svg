<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="900" viewBox="0 0 1440 900" role="img" aria-labelledby="title desc">
  <title id="title">HomeKit Inspector sample interface</title>
  <desc id="desc">Synthetic screenshot-style illustration of the HomeKit Inspector HTML interface with contextual filters.</desc>
  <rect width="1440" height="900" fill="#f4f7fb"/>
  <style>
    .title{font:700 30px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#172033}
    .h2{font:700 24px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#172033}
    .h3{font:700 13px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#68758a;letter-spacing:.8px}
    .text{font:500 15px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#172033}
    .muted{font:400 13px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#68758a}
    .badge{font:500 12px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#68758a}
    .metricNumber{font:700 20px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#172033}
    .metricLabel{font:400 12px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#68758a}
    .homeLabel{font:700 10px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#68758a;letter-spacing:.6px}
    .homeName{font:650 14px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#172033}
  </style>
  <defs>
    <linearGradient id="inspectorHomeGradient" x1="10" y1="8" x2="50" y2="56" gradientUnits="userSpaceOnUse">
      <stop stop-color="#ffb547"/>
      <stop offset="1" stop-color="#ff7a1a"/>
    </linearGradient>
  </defs>
  <g transform="translate(40 24) scale(.59375)">
    <rect x="5" y="5" width="54" height="54" rx="13" fill="#fff3df"/>
    <path d="M16 31 32 17l16 14v17a3 3 0 0 1-3 3H19a3 3 0 0 1-3-3V31Z" fill="url(#inspectorHomeGradient)"/>
    <path d="M24 31.5 32 24l8 7.5V45H24V31.5Z" fill="#ffd986"/>
    <circle cx="43" cy="43" r="9" fill="none" stroke="#2563eb" stroke-width="4"/>
    <path d="m49 49 6 6" stroke="#2563eb" stroke-width="4" stroke-linecap="round"/>
  </g>
  <text x="90" y="53" class="title">HomeKit Inspector</text>
  <text x="1400" y="37" text-anchor="end" class="homeLabel">HOME</text>
  <text x="1400" y="56" text-anchor="end" class="homeName">Example Home</text>

  <g transform="translate(40 86)">
    <g>
      <rect width="186" height="64" rx="7" fill="#fff" stroke="#dce3ed"/>
      <rect width="3" height="64" fill="#2563eb"/><text x="12" y="28" class="metricNumber" style="fill:#2563eb">12</text>
      <text x="12" y="50" class="metricLabel">Rooms</text>
    </g>
    <g transform="translate(196 0)">
      <rect width="186" height="64" rx="7" fill="#fff" stroke="#dce3ed"/>
      <rect width="3" height="64" fill="#11834f"/><text x="12" y="28" class="metricNumber" style="fill:#11834f">64</text>
      <text x="12" y="50" class="metricLabel">Accessories</text>
    </g>
    <g transform="translate(392 0)">
      <rect width="186" height="64" rx="7" fill="#fff" stroke="#dce3ed"/>
      <rect width="3" height="64" fill="#bd3e4a"/><text x="12" y="28" class="metricNumber" style="fill:#bd3e4a">5</text>
      <text x="12" y="50" class="metricLabel">Hubs</text>
    </g>
    <g transform="translate(588 0)">
      <rect width="186" height="64" rx="7" fill="#fff" stroke="#dce3ed"/>
      <rect width="3" height="64" fill="#6d5bd0"/><text x="12" y="28" class="metricNumber" style="fill:#6d5bd0">8</text>
      <text x="12" y="50" class="metricLabel">Bridges</text>
    </g>
    <g transform="translate(784 0)">
      <rect width="186" height="64" rx="7" fill="#fff" stroke="#dce3ed"/>
      <rect width="3" height="64" fill="#a65f00"/><text x="12" y="28" class="metricNumber" style="fill:#a65f00">11</text>
      <text x="12" y="50" class="metricLabel">Manufacturers</text>
    </g>
    <g transform="translate(980 0)">
      <rect width="186" height="64" rx="7" fill="#fff" stroke="#dce3ed"/>
      <rect width="3" height="64" fill="#2563eb"/><text x="12" y="28" class="metricNumber" style="fill:#2563eb">42</text>
      <text x="12" y="50" class="metricLabel">Automations</text>
    </g>
    <g transform="translate(1176 0)">
      <rect width="184" height="64" rx="7" fill="#fff" stroke="#dce3ed"/>
      <rect width="3" height="64" fill="#0891b2"/><text x="12" y="28" class="metricNumber" style="fill:#0891b2">16</text>
      <text x="12" y="50" class="metricLabel">Scenes</text>
    </g>
  </g>

  <g transform="translate(40 176)">
