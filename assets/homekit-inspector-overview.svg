    <rect x="18" y="48" width="182" height="116" rx="7" fill="#fff" stroke="#dce3ed"/>
    <text x="34" y="78" class="text">Kitchen</text>
    <circle cx="38" cy="104" r="3" fill="#172033"/><text x="50" y="109" class="text">Kitchen Motion</text>
    <circle cx="38" cy="132" r="3" fill="#172033"/><text x="50" y="137" class="text">Table Light</text>
    <rect x="220" y="48" width="182" height="116" rx="7" fill="#fff" stroke="#dce3ed"/>
    <text x="236" y="78" class="text">Living Room</text>
    <circle cx="240" cy="104" r="3" fill="#172033"/><text x="252" y="109" class="text">Window Sensor</text>
    <circle cx="240" cy="132" r="3" fill="#172033"/><text x="252" y="137" class="text">Floor Lamp</text>
  </g>

  <g transform="translate(508 356)">
    <rect width="424" height="204" rx="8" fill="#fff" stroke="#dce3ed"/>
    <text x="18" y="30" class="h3">EXTERIOR</text>
    <rect x="18" y="48" width="182" height="116" rx="7" fill="#fff" stroke="#dce3ed"/>
    <text x="34" y="78" class="text">Front Gate</text>
    <circle cx="38" cy="104" r="3" fill="#172033"/><text x="50" y="109" class="text">Gate Contact</text>
    <circle cx="38" cy="132" r="3" fill="#172033"/><text x="50" y="137" class="text">Driveway Lights</text>
    <rect x="220" y="48" width="182" height="116" rx="7" fill="#fff" stroke="#dce3ed"/>
    <text x="236" y="78" class="text">Garden</text>
    <circle cx="240" cy="104" r="3" fill="#172033"/><text x="252" y="109" class="text">Weather Sensor</text>
    <circle cx="240" cy="132" r="3" fill="#172033"/><text x="252" y="137" class="text">Path Lights</text>
  </g>

  <g transform="translate(952 356)">
    <rect width="424" height="204" rx="8" fill="#fff" stroke="#dce3ed"/>
    <text x="18" y="30" class="h3">SYSTEM</text>
    <rect x="18" y="48" width="386" height="116" rx="7" fill="#fff" stroke="#dce3ed"/>
    <text x="34" y="78" class="text">Homebridge</text>
    <circle cx="38" cy="104" r="3" fill="#172033"/><text x="50" y="109" class="text">Security Mode Helper</text>
    <circle cx="38" cy="132" r="3" fill="#172033"/><text x="50" y="137" class="text">Webhook Contact</text>
  </g>

  <g transform="translate(64 602)">
    <rect width="1312" height="190" rx="8" fill="#fff" stroke="#dce3ed"/>
    <text x="18" y="30" class="h3">AUTOMATION DETAIL PREVIEW</text>
    <text x="18" y="64" class="h2">Example Front Gate Opens</text>
    <rect x="18" y="86" width="396" height="78" rx="7" fill="#f7faff" stroke="#dce3ed"/><rect x="18" y="86" width="396" height="3" fill="#2563eb"/>
    <text x="34" y="112" class="h3">WHEN</text>
    <text x="34" y="142" class="text">Gate Contact changes door state</text>
    <rect x="458" y="86" width="396" height="78" rx="7" fill="#faf9ff" stroke="#dce3ed"/><rect x="458" y="86" width="396" height="3" fill="#6d5bd0"/>
    <text x="474" y="112" class="h3">IF</text>
    <text x="474" y="142" class="text">sunset &lt;= now(); sunrise &gt; now()</text>
    <rect x="898" y="86" width="396" height="78" rx="7" fill="#f7fcf9" stroke="#dce3ed"/><rect x="898" y="86" width="396" height="3" fill="#11834f"/>
    <text x="914" y="112" class="h3">THEN</text>
    <text x="914" y="142" class="text">Turn on Driveway Lights</text>
